# Every training run for the mid-October 2026 deadline, in priority order.
# All final training runs on batch (RTX 3060, one client per GPU) so every
# result, the baselines included, comes from one GPU model and one code
# version; the August bigbatch baselines are retrained for the same reason.
# Missing-modality runs come first. SAM is last and is the first thing to
# drop if time runs out.
name: deadline_2026_10
stall_minutes: 75
finalize_minutes: 180
max_attempts_without_progress: 3
known_bad_nodes:
  mscluster44: bigbatch GPU unusable (2026-09-24 probe)
  mscluster45: bigbatch GPU unusable (2026-09-24 probe)
  mscluster57: bigbatch GPU unusable (2026-09-24 probe)
  mscluster59: bigbatch GPU unusable (2026-09-24 probe)
  mscluster62: bigbatch GPU unusable (2026-09-24 probe)
  mscluster65: bigbatch GPU unusable (2026-09-24 probe)
  mscluster75: bigbatch GPU unusable (2026-09-24 probe)
  mscluster83: bigbatch GPU unusable (2026-09-24 probe)
  mscluster129: batch GPU unusable (2026-09-24 probe)
  mscluster124: batch, slow NFS I/O (2026-09) and "Kill task failed" drain (2026-10-13)
  mscluster125: batch, "Kill task failed" drain (2026-10-13)
  mscluster85: bigbatch, "Kill task failed" drain (since 2026-09-19)
  mscluster50: bigbatch GPU unusable, NVML driver/library mismatch (2026-10-13 probe)
  mscluster51: bigbatch GPU unusable (2026-10-13 probe)
  mscluster76: bigbatch GPU unusable (2026-10-13 probe)
  mscluster82: bigbatch, every job fails within 1 s with exit 6 (2026-10-13)
  mscluster74: bigbatch, server validation 312 s per round against 26 s on other nodes (2026-10-14)
partitions:
  # batch allows 13 running jobs per user (job_limit). A run is only submitted
  # when all its jobs (server + clients, or one centralized job) can hold a
  # slot at once. Training runs may hold all 13 slots: k8 (9 jobs) then trains
  # beside k3 (4) instead of waiting for it; every other remaining pair of runs
  # uses 10, which leaves room for evaluations. (12 until 2026-09-27, when it
  # also covered centralized runs and servers finalizing for an hour.)
  # max_active 5 from 2026-10-06 so the three converged centralized runs (one
  # job each) train beside the two E = 10 runs.
  batch: {max_active: 5, max_jobs: 13, job_limit: 13}
  # Not used for final training (2026-09-24): no working node was free and the
  # queue head waited ~3 days. Kept so status shows the old attempts. From
  # 2026-10-13 it runs the interim bigbatch copies of the FedAMM comm-eff
  # ablation while batch is down: one five-job run at a time (6 jobs per user),
  # its periodic evaluation taking the sixth slot.
  bigbatch: {max_active: 1, max_jobs: 6, job_limit: 6}
# After a run finishes, one single-GPU job computes HD95/sensitivity and the
# modality-robustness pass for every 10th round checkpoint, then the test report.
posthoc: {partition: batch, max_active: 2, every: 10}
runs:
  # Missing modalities, alpha = 0.1
  - {config: configs/fedamm_uneven/alpha_0_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/alpha_0_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Missing modalities, alpha = 0.001
  - {config: configs/fedamm_uneven/alpha_0_001.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/modality_sweep/alpha_0_001.yaml, seeds: [42], partitions: [batch]}
  # Full-modality reference every method is compared against
  - {config: configs/fedavg_uneven/baseline.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Centralized reference: one job per seed; a retry resumes from last.pt.
  - {config: configs/centralized/baseline.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Communication-efficiency tuning (prerequisite for the comm_eff best runs;
  # add those configs here once the best p and bit widths are chosen)
  - {config: configs/selective_transmission_uneven/p_0_25.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/selective_transmission_uneven/p_0_1.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/selective_transmission_uneven/p_0_01.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedmpq_uneven/homogeneous_4bit.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedmpq_uneven/heterogeneous_2_4_8bit.yaml, seeds: [42], partitions: [batch]}
  # Even-split reference
  - {config: configs/fedavg_even/baseline.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Training-configuration sweeps. e10 exceeds batch's 24 h limit and resumes
  # from its latest round. e5 reruns from scratch: its 2026-09-18 run carries
  # selection state from the old client-side evaluation.
  - {config: configs/fedavg_train_configs_uneven/local_epochs_sweeps/e5.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/local_epochs_sweeps/e10.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/client_sweeps/k3.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/client_sweeps/k5.yaml, seeds: [42], partitions: [batch]}
  # Nine jobs: runs only while no other five-job run is active.
  - {config: configs/fedavg_train_configs_uneven/client_sweeps/k8.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/mini_batch_sweeps/b4.yaml, seeds: [42], partitions: [batch]}
  # Peak GPU memory of a batch-8 training step on 96^3 patches: 2.15 GiB
  # (measured 2026-09-25), well within the RTX 3060's 12 GB.
  - {config: configs/fedavg_train_configs_uneven/mini_batch_sweeps/b8.yaml, seeds: [42], partitions: [batch]}
  # Best communication-efficient settings (Experiments.md): p = 0.25, chosen by
  # highest validation Dice of the selective transmission tuning runs, with
  # mixed 2/4/8-bit quantization; FedAMM combination at alpha 0.1.
  - {config: configs/comm_eff_uneven/best.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_uneven/best.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Missing modalities, alpha = 0.2 (added 2026-09-26): a third level to test
  # FedAMM further, with the FedAvg-MM control; mirrors alpha 0.1.
  - {config: configs/fedamm_uneven/alpha_0_2.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/alpha_0_2.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Model-agnostic, last and dropped first if time runs out. Smoke-tested and
  # learning-checked 2026-09-25 (docs/sam.md). SAM 1 runs past batch's 24 h
  # limit and resumes from its latest round.
  - {config: configs/model_agnostic_uneven/sam2/baseline.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/model_agnostic_uneven/sam1/baseline.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # E = 5 and E = 10 on the other two seeds (added 2026-09-30), after SAM 1:
  # seed 42 of each beat the centralized baseline. E = 5 seed 43 started on
  # 2026-10-01; the rest wait behind the Dirichlet missing-modality runs.
  - {config: configs/fedavg_train_configs_uneven/local_epochs_sweeps/e5.yaml, seeds: [43], partitions: [batch]}
  # FedAMM-style Dirichlet modality partition (added 2026-10-01; see
  # docs/missing_modalities.md): FedAMM, FedAvg-MM and the zero-filled U-Net,
  # alpha 0.1 first with seed 42 of all three as a sanity check, then 0.001,
  # then 1. Replaces the zero-filled U-Net on the missing_uneven partition,
  # which never started.
  - {config: configs/fedamm_uneven/dirichlet_alpha_0_1.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/dirichlet_alpha_0_1.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/unet_zero_fill_dirichlet_alpha_0_1.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedamm_uneven/dirichlet_alpha_0_1.yaml, seeds: [43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/dirichlet_alpha_0_1.yaml, seeds: [43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/unet_zero_fill_dirichlet_alpha_0_1.yaml, seeds: [43, 44], partitions: [batch]}
  - {config: configs/fedamm_uneven/dirichlet_alpha_0_001.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/dirichlet_alpha_0_001.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/unet_zero_fill_dirichlet_alpha_0_001.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedamm_uneven/dirichlet_alpha_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/dirichlet_alpha_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/unet_zero_fill_dirichlet_alpha_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # FedAMM + comm-eff (top 10 %, 2/4/8-bit) on the Dirichlet partition at alpha
  # 0.1 and 1 (user, 2026-10-01).
  - {config: configs/fedamm_comm_eff_uneven/dirichlet_alpha_0_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_uneven/dirichlet_alpha_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Client-count sweep with the K = 4 split's shape (piecewise-linear Lorenz rule,
  # added 2026-10-01; see docs/fixed_quantity_skew.md). K = 8 takes nine jobs and
  # K = 3 four, so they run side by side; then K = 5. The k3/k5/k8 runs above keep
  # the extreme halving split; K = 4 is the existing 50/25/15/10 run.
  - {config: configs/fedavg_train_configs_uneven/client_sweeps/k8_lorenz.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/client_sweeps/k3_lorenz.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/client_sweeps/k5_lorenz.yaml, seeds: [42], partitions: [batch]}
  # Best comm-eff and FedAMM + comm-eff rerun with p = 0.1 (user, 2026-10-01): at
  # p = 0.25 the combination uploads more than 2/4/8-bit quantization alone.
  - {config: configs/comm_eff_uneven/best_p_0_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_uneven/best_p_0_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/local_epochs_sweeps/e5.yaml, seeds: [44], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/local_epochs_sweeps/e10.yaml, seeds: [43, 44], partitions: [batch]}
  # Centralized trained to convergence (user, 2026-10-06): up to 750 epochs,
  # minimum 150, patience 50; see configs/centralized/converged.yaml.
  - {config: configs/centralized/converged.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Quantized broadcast on the best comm-eff configuration, one seed (lecturer
  # feedback, 2026-10-06); see docs/quantized_federated_learning.md.
  - {config: configs/comm_eff_uneven/best_p_0_1_downlink_8bit.yaml, seeds: [42], partitions: [batch]}
  # Centralized with a fixed 200-epoch budget, last in the order (user,
  # 2026-10-06); see configs/centralized/fixed_200.yaml.
  - {config: configs/centralized/fixed_200.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Quantized broadcast, follow-up (user, 2026-10-07): seeds 43 and 44 of the
  # 8-bit broadcast, then a 4-bit and a 2-bit broadcast on seed 42.
  - {config: configs/comm_eff_uneven/best_p_0_1_downlink_8bit.yaml, seeds: [43, 44], partitions: [batch]}
  # Dataset cache check (user, 2026-10-07): FedAvg as the campaign runs it, 50
  # rounds, seed 42, twice without and twice with the cache; ahead of the
  # broadcast sweep.
  - {config: configs/cache_check_uneven/no_cache_a.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/cache_check_uneven/cache_a.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/cache_check_uneven/no_cache_b.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/cache_check_uneven/cache_b.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/comm_eff_uneven/best_p_0_1_downlink_4bit.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/comm_eff_uneven/best_p_0_1_downlink_2bit.yaml, seeds: [42], partitions: [batch]}
  # FedAvg-MM with the best comm-eff setting (user, 2026-10-07): first on the
  # Dirichlet partition at alpha 0.1 (the FedAvg counterpart of
  # fedamm_comm_eff_uneven/dirichlet_alpha_0_1), then at q = 0.1 (the
  # counterpart of fedamm_comm_eff_uneven/best_p_0_1).
  - {config: configs/fedavg_mm_comm_eff_uneven/dirichlet_alpha_0_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_mm_comm_eff_uneven/best_p_0_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Zero-filled U-Net on the per-modality dropout partitions (q = 0.1 and 0.2),
  # restored (user, 2026-10-08): it was replaced by the Dirichlet runs on
  # 2026-10-01 before it started, so FedAMM and FedAvg-MM at q had no control.
  - {config: configs/fedavg_missing_modalities_uneven/unet_zero_fill_alpha_0_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/unet_zero_fill_alpha_0_2.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # FedAMM comm-eff ablation (user, 2026-10-13): FedAMM with FedMPQ 2/4/8-bit
  # alone and with top 10 % selective transmission alone, at q = 0.1 and on the
  # Dirichlet partition at alpha 0.1, against fedamm_comm_eff_uneven (both
  # together). 98 of 100 batch nodes stopped responding at 07:07 that day, so
  # interim copies run on bigbatch (user-approved exception to batch-only),
  # listed first so the waiting batch runs do not block them. The batch runs
  # stay queued and start when batch returns; they are the reported results.
  - {config: configs/fedamm_comm_eff_ablation_uneven/bigbatch/fedmpq_alpha_0_1.yaml, seeds: [42], partitions: [bigbatch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/bigbatch/selective_alpha_0_1.yaml, seeds: [42], partitions: [bigbatch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/bigbatch/fedmpq_alpha_0_1.yaml, seeds: [43, 44], partitions: [bigbatch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/bigbatch/selective_alpha_0_1.yaml, seeds: [43, 44], partitions: [bigbatch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/bigbatch/fedmpq_dirichlet_alpha_0_1.yaml, seeds: [42], partitions: [bigbatch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/bigbatch/selective_dirichlet_alpha_0_1.yaml, seeds: [42], partitions: [bigbatch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/bigbatch/fedmpq_dirichlet_alpha_0_1.yaml, seeds: [43, 44], partitions: [bigbatch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/bigbatch/selective_dirichlet_alpha_0_1.yaml, seeds: [43, 44], partitions: [bigbatch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/fedmpq_alpha_0_1.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/selective_alpha_0_1.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/fedmpq_alpha_0_1.yaml, seeds: [43, 44], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/selective_alpha_0_1.yaml, seeds: [43, 44], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/fedmpq_dirichlet_alpha_0_1.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/selective_dirichlet_alpha_0_1.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/fedmpq_dirichlet_alpha_0_1.yaml, seeds: [43, 44], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_ablation_uneven/selective_dirichlet_alpha_0_1.yaml, seeds: [43, 44], partitions: [batch]}
