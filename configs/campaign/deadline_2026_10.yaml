# Every training run for the mid-October 2026 deadline, in priority order.
# All final training runs on batch (RTX 3060, one client per GPU) so every
# result, the baselines included, comes from one GPU model and one code
# version; the August bigbatch baselines are retrained for the same reason.
# Missing-modality runs come first. SAM is last and is the first thing to
# drop if time runs out.
name: deadline_2026_10
stall_minutes: 75
finalize_minutes: 180
max_attempts_without_progress: 3
known_bad_nodes:
  mscluster44: bigbatch GPU unusable (2026-09-24 probe)
  mscluster45: bigbatch GPU unusable (2026-09-24 probe)
  mscluster57: bigbatch GPU unusable (2026-09-24 probe)
  mscluster59: bigbatch GPU unusable (2026-09-24 probe)
  mscluster62: bigbatch GPU unusable (2026-09-24 probe)
  mscluster65: bigbatch GPU unusable (2026-09-24 probe)
  mscluster75: bigbatch GPU unusable (2026-09-24 probe)
  mscluster83: bigbatch GPU unusable (2026-09-24 probe)
  mscluster129: batch GPU unusable (2026-09-24 probe)
partitions:
  # batch allows 13 running jobs per user (job_limit). A run is only submitted
  # when all its jobs (server + clients, or one centralized job) can hold a
  # slot at once. Training runs may hold all 13 slots: k8 (9 jobs) then trains
  # beside k3 (4) instead of waiting for it; every other remaining pair of runs
  # uses 10, which leaves room for evaluations. (12 until 2026-09-27, when it
  # also covered centralized runs and servers finalizing for an hour.)
  batch: {max_active: 4, max_jobs: 13, job_limit: 13}
  # Not used for final training (2026-09-24): no working node was free and the
  # queue head waited ~3 days. Kept so status shows the old attempts.
  bigbatch: {max_active: 0, max_jobs: 6, job_limit: 6}
# After a run finishes, one single-GPU job computes HD95/sensitivity and the
# modality-robustness pass for every 10th round checkpoint, then the test report.
posthoc: {partition: batch, max_active: 2, every: 10}
runs:
  # Missing modalities, alpha = 0.1
  - {config: configs/fedamm_uneven/alpha_0_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/alpha_0_1.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Missing modalities, alpha = 0.001
  - {config: configs/fedamm_uneven/alpha_0_001.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/modality_sweep/alpha_0_001.yaml, seeds: [42], partitions: [batch]}
  # Full-modality reference every method is compared against
  - {config: configs/fedavg_uneven/baseline.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Centralized reference: one job per seed, no resume (a retry restarts).
  - {config: configs/centralized/baseline.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Communication-efficiency tuning (prerequisite for the comm_eff best runs;
  # add those configs here once the best p and bit widths are chosen)
  - {config: configs/selective_transmission_uneven/p_0_25.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/selective_transmission_uneven/p_0_1.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/selective_transmission_uneven/p_0_01.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedmpq_uneven/homogeneous_4bit.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedmpq_uneven/heterogeneous_2_4_8bit.yaml, seeds: [42], partitions: [batch]}
  # Even-split reference
  - {config: configs/fedavg_even/baseline.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Training-configuration sweeps. e10 exceeds batch's 24 h limit and resumes
  # from its latest round. e5 reruns from scratch: its 2026-09-18 run carries
  # selection state from the old client-side evaluation.
  - {config: configs/fedavg_train_configs_uneven/local_epochs_sweeps/e5.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/local_epochs_sweeps/e10.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/client_sweeps/k3.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/client_sweeps/k5.yaml, seeds: [42], partitions: [batch]}
  # Nine jobs: runs only while no other five-job run is active.
  - {config: configs/fedavg_train_configs_uneven/client_sweeps/k8.yaml, seeds: [42], partitions: [batch]}
  - {config: configs/fedavg_train_configs_uneven/mini_batch_sweeps/b4.yaml, seeds: [42], partitions: [batch]}
  # Peak GPU memory of a batch-8 training step on 96^3 patches: 2.15 GiB
  # (measured 2026-09-25), well within the RTX 3060's 12 GB.
  - {config: configs/fedavg_train_configs_uneven/mini_batch_sweeps/b8.yaml, seeds: [42], partitions: [batch]}
  # Best communication-efficient settings (Experiments.md): p = 0.25, chosen by
  # highest validation Dice of the selective transmission tuning runs, with
  # mixed 2/4/8-bit quantization; FedAMM combination at alpha 0.1.
  - {config: configs/comm_eff_uneven/best.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedamm_comm_eff_uneven/best.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Missing modalities, alpha = 0.2 (added 2026-09-26): a third level to test
  # FedAMM further, with the FedAvg-MM control; mirrors alpha 0.1.
  - {config: configs/fedamm_uneven/alpha_0_2.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/fedavg_missing_modalities_uneven/alpha_0_2.yaml, seeds: [42, 43, 44], partitions: [batch]}
  # Model-agnostic, last and dropped first if time runs out. Smoke-tested and
  # learning-checked 2026-09-25 (docs/sam.md). SAM 1 runs past batch's 24 h
  # limit and resumes from its latest round.
  - {config: configs/model_agnostic_uneven/sam2/baseline.yaml, seeds: [42, 43, 44], partitions: [batch]}
  - {config: configs/model_agnostic_uneven/sam1/baseline.yaml, seeds: [42, 43, 44], partitions: [batch]}
