# Experiments.md: best communication-efficient FedAvg = selective transmission
# (p from the p_0_25 / p_0_1 / p_0_01 tuning runs) with mixed 2/4/8-bit
# quantization of the transmitted values (the heterogeneous FedMPQ policy).
extends: ../fedmpq_uneven/heterogeneous_2_4_8bit.yaml
experiment: {family: comm_eff_uneven, variant: best, runs: 3, seeds: [42, 43, 44]}
selection:
  status: selected
  note: >-
    p = 0.25 had the highest held-out validation Dice of the selective
    transmission tuning runs (seed 42): p 0.25 0.8552, p 0.1 0.8513,
    p 0.01 0.8419 (2026-09-26). Test data was not used for the choice.
quantization:
  sparsification: {enabled: true, method: topk, fraction: 0.25, error_feedback: true, scope: global}
