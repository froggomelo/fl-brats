schema_version: 1
experiment:
  family: fedavg_uneven
  runs: 3
  seeds: [42, 43, 44]
seed: 42
deterministic: true
device: auto
output_root: outputs
log_root: logs
cache_root: cache
checkpoint_root: checkpoints
num_workers: 3
initial_weights: artifacts/initial_weights/unet_seed_42.pt
initial_weights_by_seed:
  42: artifacts/initial_weights/unet_seed_42.pt
  43: artifacts/initial_weights/unet_seed_43.pt
  44: artifacts/initial_weights/unet_seed_44.pt
data:
  partition_root: data/partitions/fedavg_uneven
  split_path: data/splits/brats2021.json
  client_proportions: [0.50, 0.25, 0.15, 0.10]
  cache_mode: persistent
  # Cache preprocessed volumes on each node's local SSD (/var/tmp), not on NFS.
  cache_location: node
model:
  name: unet
  in_channels: 4
  out_channels: 3
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
loss:
  name: dice_ce
optimizer:
  name: adam
  lr: 0.0001
  weight_decay: 0.0
training:
  batch_size: 1
  max_rounds: 150
  # Three loader workers overlap data fetch with the GPU step on 6-CPU nodes.
  num_workers: 3
  pin_memory: false
federated:
  strategy: fedavg
  server_address: null
  server_port: 8080
  num_rounds: 150
  minimum_rounds: 100
  early_stopping_patience: 50
  num_clients: 4
  fraction_fit: 1.0
  fraction_evaluate: 0.0
  min_fit_clients: 4
  min_evaluate_clients: 0
  min_available_clients: 4
  local_epochs: 1
  accept_failures: false
quantization:
  enabled: false
  mode: none
  transmitted_object: delta
  sparsification: {enabled: false, method: topk, fraction: 1.0, error_feedback: true, scope: global}
communication_measurement:
  payload_bytes: true
  timing: communication_and_coordination
  slurm_interconnect:
    enabled: false
    sampling_seconds: 30
slurm:
  # batch nodes carry one RTX 3060 each (6 CPUs, 30 GB). bigbatch GPUs are not
  # reachable without GRES, which this cluster rejects, so bigbatch runs on CPU.
  partition: batch
  account: null
  qos: null
  time: "24:00:00"
  nodes: 1
  tasks: 1
  cpus_per_task: 6
  memory: 29000M
  gres: null
  exclusive: false
  # Fail fast on nodes whose GPU driver is broken instead of training on CPU.
  require_gpu: true
  exclude: []
  use_apptainer: true
  image: apptainer/fl-brats-batch.sif
  # Run the checked-out src/ rather than the copy baked into the image.
  bind_source: true
missing_modalities:
  enabled: false
  mode: none
  evaluation: {evaluate_all_non_empty_combinations: true, report_per_client: true}

# Dedicated research evaluation data: held-out validation only, never pooled client data.
evaluation:
  natural_every_rounds: 1
  # HD95/sensitivity and the 15-combination robustness pass are reporting-only
  # and blocked training for hours every tenth round. They run after training
  # on the saved checkpoints instead (fedbrats evaluate-periodic-checkpoints
  # --every 10); best and final checkpoints still get them at finalization.
  expensive_metrics_every_rounds: 0
  robustness_every_rounds: 0
  periodic_evaluation_every_rounds: 10
  # HD95 runs a single-threaded CPU distance transform; batch nodes have 6 CPUs.
  hd95_workers: 5
  evaluate_best_checkpoint: true
  evaluate_final_checkpoint: true
  client_diagnostics: false
  modality_seed: 42
