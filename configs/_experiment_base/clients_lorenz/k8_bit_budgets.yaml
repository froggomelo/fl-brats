# 2/4/8-bit budgets for eight clients by size rank, as at K = 4: the largest
# client 8 bits, the second 4, the rest 2.
quantization:
  mixed:
    client_average_bit_width_budgets: {client_0: 8.0, client_1: 4.0, client_2: 2.0, client_3: 2.0, client_4: 2.0, client_5: 2.0, client_6: 2.0, client_7: 2.0}
