extends: federated_uneven.yaml
initial_weights: artifacts/initial_weights/fedamm_seed_42.pt
initial_weights_by_seed:
  42: artifacts/initial_weights/fedamm_seed_42.pt
  43: artifacts/initial_weights/fedamm_seed_43.pt
  44: artifacts/initial_weights/fedamm_seed_44.pt
data:
  partition_root: data/partitions/missing_uneven/alpha_0_1
model:
  name: fedamm
  in_channels: 4
  out_channels: 3
  channels: [8, 16, 32, 64]
  prototype_loss_weight: 0.0
  prototype_distillation_enabled: false
  global_prototype_alignment_enabled: false
  emit_prototypes: false
  modality_weighted_aggregation: false
missing_modalities:
  enabled: true
  mode: arbitrary
  seed: 42
  require_at_least_one: true
  arbitrary:
    per_modality_missing_probability: {t1: 0.1, t1ce: 0.1, t2: 0.1, flair: 0.1}
    combination_probabilities: {}
  evaluation:
    evaluate_all_non_empty_combinations: true
    report_per_client: true
    robustness_every_rounds: 0  # periodic metrics run after training; see federated_uneven.yaml
    expensive_metrics_every_rounds: 0
    evaluate_best_checkpoint: true
    evaluate_final_checkpoint: true
