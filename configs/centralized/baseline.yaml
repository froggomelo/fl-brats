schema_version: 1
experiment: {family: centralized, variant: baseline, runs: 3, seeds: [42, 43, 44]}
seed: 42
deterministic: true
device: auto
output_root: outputs
log_root: logs
cache_root: cache
checkpoint_root: checkpoints
initial_weights: artifacts/initial_weights/unet_seed_42.pt
initial_weights_by_seed:
  42: artifacts/initial_weights/unet_seed_42.pt
  43: artifacts/initial_weights/unet_seed_43.pt
  44: artifacts/initial_weights/unet_seed_44.pt
data:
  # index_path and split_path come from .env (DATASET_INDEX_PATH,
  # FL_BRATS_SPLIT_PATH) inside the job, the same files the federated runs use.
  partition_path: data/partitions/fedavg_uneven/manifest.json
  cache_mode: persistent
  cache_location: node
model: {name: unet_baseline}
training: {epochs: 100, minimum_epochs: 100, batch_size: 1, num_workers: 3, pin_memory: false, early_stopping_patience: 25, early_stopping_min_delta: 0.001}
# Same job shape as a federated client on batch (one RTX 3060).
slurm:
  partition: batch
  account: null
  qos: null
  time: "24:00:00"
  nodes: 1
  tasks: 1
  cpus_per_task: 6
  memory: 29000M
  gres: null
  exclusive: false
  exclude: []
  require_gpu: true
  use_apptainer: true
  image: apptainer/fl-brats-batch.sif
  bind_source: true
